name: Link health check

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: link-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every link
        run: npm run health
      - name: Rebuild generated files
        run: npm run check
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links.json data/checks.json logs/health.log assets/js/links.js shelves
          if git diff --cached --quiet; then
            echo "No link changes to commit."
          else
            git commit -m "chore: scheduled link health check"
            git push
          fi
